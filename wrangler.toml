name = "grocery-list"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "grocery-list-db"
database_id = "df6ec9f6-01a4-4f57-a5cb-834f25e179e1"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "grocery-list-attachments"
# Set AGENT_PASSWORD_PEPPER for agent ID/password login.
# Keep TELEGRAM_BOT_TOKEN for Telegram Mini App authentication.
# Set SHARED_DATA_MODE=true after explicitly enrolling shared Telegram users and copying data.
# Configure SESSION_SECRET and APP_ORIGIN in Cloudflare Pages. See README.md.
